server {
    listen 80;
    listen [::]:80;
    server_name 47.108.74.69;

    root /var/www/trippilot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The AMap security code stays in this root-readable server file.
    include /etc/nginx/snippets/trippilot-amap-secret.conf;

    location /_AMapService/v4/map/styles {
        set $args "$args&jscode=$trippilot_amap_jscode";
        proxy_pass https://webapi.amap.com/v4/map/styles;
    }

    location /_AMapService/ {
        set $args "$args&jscode=$trippilot_amap_jscode";
        proxy_pass https://restapi.amap.com/;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
