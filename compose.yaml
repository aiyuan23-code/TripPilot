name: trippilot

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:?Set VITE_AMAP_JS_KEY in .env}
        VITE_AMAP_SERVICE_HOST: /_AMapService
    environment:
      AMAP_JS_SECURITY_CODE: ${AMAP_JS_SECURITY_CODE:?Set AMAP_JS_SECURITY_CODE in .env}
      NGINX_ENVSUBST_FILTER: AMAP_JS_SECURITY_CODE
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
